
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Neon subtle inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="#a3e635" fill-opacity="0.04" />

  <!-- Code bracket: Left < -->
  <path d="M148 200 L96 256 L148 312" stroke="#a3e635" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center 'S' Monogram -->
  <path d="M 300 188
           C 285 168, 255 164, 235 174
           C 205 188, 205 224, 235 240
           L 277 262
           C 310 278, 312 316, 282 334
           C 256 348, 220 342, 204 320"
        stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code bracket: Right /> -->
  <path d="M364 200 L416 256 L364 312" stroke="#a3e635" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>
